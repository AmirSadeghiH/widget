name: Widget quality

on:
  push:
    paths:
      - 'widget/**'
      - 'widget.js'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.mjs'
      - '.github/workflows/widget-quality.yml'
  pull_request:
    paths:
      - 'widget/**'
      - 'widget.js'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.mjs'
      - '.github/workflows/widget-quality.yml'

permissions:
  contents: read

concurrency:
  group: widget-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widgets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify standalone bundles and all browser scenarios
        run: npm test
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: widget-quality-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
